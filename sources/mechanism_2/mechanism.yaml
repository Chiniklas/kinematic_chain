schema_version: 1

mechanism:
  id: mechanism_2
  name: Mechanism 2 source abstraction
  model_kind: planar_body_joint_graph
  status: nominal_photo_geometry
  dimension_units: mm
  coordinate_system:
    plane: xy
    x_direction: proximal_to_distal
    y_direction: upward
  notes:
    - Layout coordinates are diagram coordinates only and are not dimensions.
    - Link lengths are nominal photo estimates, not manufacturing measurements.
    - Rigid-body membership was confirmed as ADE (ground), CDF, and FHI after merging F/G.
    - The source F and G labels identify the same revolute joint, canonicalized as f.
    - Source labels H and I remain h and i; g is intentionally absent as a separate node.

sources:
  - file: 1224a3cf4f13d2e78e428296289e2e0c.jpg
    kind: assembly_photograph
  - file: ab4fee494c4cea35c5e700c6c13c9f42.jpg
    kind: handwritten_topology

photo_calibration:
  image: 1224a3cf4f13d2e78e428296289e2e0c.jpg
  image_orientation: exif_autorotated_landscape
  image_size_pixels: [4032, 3024]
  pixels_per_mm: 24.3
  relative_uncertainty: 0.08
  method: XL330 case and mounting geometry visible in the photograph
  reference_component: DYNAMIXEL XL330-M288-T
  reference_dimensions_mm: [20.0, 34.0, 26.0]
  reference_url: https://emanual.robotis.com/docs/en/dxl/x/xl330-m288/

# Node table. `layout` is used only to render the abstraction.
nodes:
  - id: a
    source_label: A
    kind: revolute
    role: actuated base pivot
    fixed: true
    layout: [0.0, 0.0]
    photo_pixel: [844, 1679]
    confidence: high
  - id: b
    source_label: B
    kind: revolute
    role: input crank endpoint
    fixed: false
    layout: [-0.18, 2.45]
    photo_pixel: [802, 1091]
    confidence: high
  - id: c
    source_label: C
    kind: revolute
    role: loop 1 / loop 2 junction
    fixed: false
    layout: [3.98, 1.52]
    photo_pixel: [1798, 1315]
    confidence: high
  - id: d
    source_label: D
    kind: revolute
    role: ADE-to-CDF revolute connection
    fixed: true
    layout: [3.97, -0.54]
    photo_pixel: [1796, 1808]
    confidence: high
  - id: e
    source_label: E
    kind: revolute
    role: lower coupler ground pivot
    fixed: true
    layout: [4.97, -0.09]
    photo_pixel: [2036, 1701]
    confidence: high
  - id: f
    source_label: F/G
    kind: revolute
    role: CDF-to-FHI revolute connection; merged source F/G point
    fixed: false
    layout: [7.60, 1.60]
    photo_pixel: [2668, 1294]
    confidence: high
  - id: h
    source_label: H
    kind: revolute
    role: lower coupler / distal-body joint
    fixed: false
    layout: [7.21, -0.40]
    photo_pixel: [2575, 1775]
    confidence: high
  - id: i
    source_label: I/T
    kind: reference
    role: fingertip/output point
    fixed: false
    layout: [10.92, 0.59]
    photo_pixel: [3464, 1538]
    confidence: high

# Rigid-body/member table. Every body lists all nodes fixed in that body.
# Binary bodies are bars; a body with 3+ nodes is a rigid multi-point body.
bodies:
  - id: ground
    kind: ground
    nodes: [a, d, e]
    role: fixed ADE frame
    confidence: high
    draw_order: 0
    color: "#64748b"
  - id: input_crank
    kind: binary_link
    nodes: [a, b]
    role: actuated crank
    confidence: high
    draw_order: 2
    color: "#2563eb"
  - id: loop_1_coupler
    kind: binary_link
    nodes: [b, c]
    role: first-stage coupler
    confidence: high
    draw_order: 2
    color: "#2563eb"
  - id: central_body
    kind: rigid_body
    nodes: [c, d, f]
    role: rigid CDF body
    confidence: high
    draw_order: 3
    color: "#059669"
  - id: link_eh
    kind: binary_link
    nodes: [e, h]
    role: lower distal coupler
    confidence: high
    draw_order: 4
    color: "#ea580c"
  - id: distal_body
    kind: rigid_body
    nodes: [f, h, i]
    role: rigid FHI distal output body after merging source F/G
    confidence: high
    draw_order: 1
    color: "#dc2626"

# Joint-incidence table.
joints:
  - node: a
    type: revolute
    bodies: [ground, input_crank]
  - node: b
    type: revolute
    bodies: [input_crank, loop_1_coupler]
  - node: c
    type: revolute
    bodies: [loop_1_coupler, central_body]
  - node: d
    type: revolute
    bodies: [ground, central_body]
  - node: e
    type: revolute
    bodies: [ground, link_eh]
  - node: f
    type: revolute
    bodies: [central_body, distal_body]
  - node: h
    type: revolute
    bodies: [link_eh, distal_body]

# Nominal joint-centre dimensions derived from photo pixels and the calibration above.
dimensions:
  - id: L_ab
    body: input_crank
    nodes: [a, b]
    value: 24.3
    units: mm
    value_source: photo_nominal
    uncertainty_mm: 1.9
  - id: L_bc
    body: loop_1_coupler
    nodes: [b, c]
    value: 42.0
    units: mm
    value_source: photo_nominal
    uncertainty_mm: 3.4
  - id: L_cd
    body: central_body
    nodes: [c, d]
    value: 20.3
    units: mm
    value_source: photo_nominal
    uncertainty_mm: 1.6
  - id: L_ad
    body: ground
    nodes: [a, d]
    value: 39.5
    units: mm
    value_source: photo_nominal
    uncertainty_mm: 3.2
  - id: L_ae
    body: ground
    nodes: [a, e]
    value: 49.1
    units: mm
    value_source: photo_nominal
    uncertainty_mm: 3.9
  - id: L_de
    body: ground
    nodes: [d, e]
    value: 10.8
    units: mm
    value_source: photo_nominal
    uncertainty_mm: 1.0
  - id: L_cf
    body: central_body
    nodes: [c, f]
    value: 35.8
    units: mm
    value_source: photo_nominal
    uncertainty_mm: 2.9
  - id: L_df
    body: central_body
    nodes: [d, f]
    value: 41.7
    units: mm
    value_source: photo_nominal
    uncertainty_mm: 3.3
  - id: L_eh
    body: link_eh
    nodes: [e, h]
    value: 22.4
    units: mm
    value_source: photo_nominal
    uncertainty_mm: 1.8
  - id: L_fh
    body: distal_body
    nodes: [f, h]
    value: 20.2
    units: mm
    value_source: photo_nominal
    uncertainty_mm: 1.6
  - id: L_fi
    body: distal_body
    nodes: [f, i]
    value: 34.3
    units: mm
    value_source: photo_nominal
    uncertainty_mm: 2.7
  - id: L_hi
    body: distal_body
    nodes: [h, i]
    value: 37.9
    units: mm
    value_source: photo_nominal
    uncertainty_mm: 3.0

# Closed paths are descriptive and are checked against the body table.
loops:
  - id: loop_1
    nodes: [a, b, c, d]
    bodies: [input_crank, loop_1_coupler, central_body, ground]
  - id: loop_2
    nodes: [d, f, h, e]
    bodies: [central_body, distal_body, link_eh, ground]

actuators:
  - id: input_q
    type: rotary
    joint: a
    body: input_crank
    reference_body: ground
    positive_direction: counter_clockwise

outputs:
  - id: fingertip
    node: i
    body: distal_body

model_readiness:
  topology_plot: ready
  numeric_link_table: ready_nominal_photo_estimates
  kinematic_sweep: placeholder_nominal_geometry_available
  optimization: placeholder_waiting_for_validated_kinematics_and_objective
  input_torque: blocked_no_validated_kinematics_masses_or_centres_of_mass
