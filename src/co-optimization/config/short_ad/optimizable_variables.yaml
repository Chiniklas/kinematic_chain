schema_version: 1

model:
  id: mechanism_and_attachment_link_length_skeleton
  status: skeleton
  nominal_design: ../../../../designs/mechanism_2/short_ad/mechanism.yaml
  mechanism_dimension_variables:
    [L_ab, L_bc, L_cd, L_ae, L_de, L_cg, L_dg, L_ef, L_fg, L_gh, L_fh]
  fixed_mechanism_dimensions: [L_ad]
  tip_rod_variable: L_tip_rod
  notes:
    - Every optimizable variable is a mechanism or attachment link length in millimetres.
    - Each finger optimization owns an independent copy of this complete variable list.
    - Every copy starts from these same nominal initial values; optimized values are never shared across fingers.
    - L_tip_rod is the external connector from TCP H to fixed upper-surface revolute R4.
    - Task-space reachability uses all mechanism dimensions and the tip-rod length.
    - L_ad is the fixed 21.112 mm grounded mounting baseline, tilted per ad_tilt_deg in the nominal design.
    - D-to-J1 dorsal clearance is read from the nominal design and remains fixed upstream.
    - Bounds are broad scaffolding limits, not validated design constraints.

variables:
  - {id: L_ab, body: input_crank, nodes: [a, b], initial: 19.248, min: 8.0, max: 45.0}
  - {id: L_bc, body: loop_1_coupler, nodes: [b, c], initial: 17.285, min: 15.0, max: 80.0}
  - {id: L_cd, body: central_body, nodes: [c, d], initial: 13.798, min: 8.0, max: 45.0}
  - {id: L_ae, body: ground, nodes: [a, e], initial: 34.766, min: 15.0, max: 60.0}
  - {id: L_de, body: ground, nodes: [d, e], initial: 20.574, min: 7.0, max: 25.0}
  - {id: L_cg, body: central_body, nodes: [c, g], initial: 62.7, min: 15.0, max: 80.0}
  - {id: L_dg, body: central_body, nodes: [d, g], initial: 74.485, min: 20.0, max: 90.0}
  - {id: L_ef, body: link_ef, nodes: [e, f], initial: 28.045, min: 10.0, max: 50.0}
  - {id: L_fg, body: distal_body, nodes: [f, g], initial: 37.927, min: 10.0, max: 45.0}
  - {id: L_gh, body: distal_body, nodes: [g, h], initial: 68.788, min: 15.0, max: 85.0}
  - {id: L_fh, body: distal_body, nodes: [f, h], initial: 54.368, min: 20.0, max: 95.0}
  - {id: L_tip_rod, category: attachment_link, attachment: distal_output_rod, nodes: [h, hand_distal_contact], initial: 22.539, min: 5.0, max: 45.0}
