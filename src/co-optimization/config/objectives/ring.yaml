schema_version: 1

objective:
  id: ring_finger_reachability
  finger: ring
  source_image: ring.jpg
  task_space_reference: distal_phalanx_lower_slot_rp4

measurement:
  method: manual_polyline_estimate_from_pixels
  nominal_pose: horizontal_extension
  maximum_pose: curled_polyline
  angular_uncertainty_deg: 5
  angle_convention:
    zero_deg: straight_horizontal
    positive_direction: flexion_toward_curled_pose
    mcp: proximal_phalanx_deviation_from_horizontal
    pip_and_dip: relative_heading_change_between_adjacent_phalanges
  notes:
    - The horizontal drawing is treated as zero flexion at all three joints.
    - Perspective and line-thickness effects are intentionally ignored.
    - Handwritten centimetre lengths are converted to millimetres.

phalanx_lengths_mm:
  proximal: 44
  middle: 26
  distal: 26

pixel_landmarks:
  coordinate_system: {origin: top_left, x_direction: right, y_direction: down}
  nominal:
    mcp: [775, 435]
    pip: [487, 440]
    dip: [303, 432]
    tip: [135, 436]
  maximum_curled:
    mcp: [775, 435]
    pip: [549, 620]
    dip: [552, 825]
    tip: [678, 928]

joint_flexion_ranges_deg:
  mcp: {min: 0, max: 39}
  pip: {min: 0, max: 52}
  dip: {min: 0, max: 50}
