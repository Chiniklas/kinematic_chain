schema_version: 1

mechanism:
  id: mechanism_2_long_ad
  name: Mechanism 2 - long tilted A-D mount
  model_kind: planar_body_joint_graph
  status: remeasured_geometry
  dimension_units: mm
  coordinate_system:
    plane: xy
    x_direction: proximal_to_distal
    y_direction: upward
  notes:
    - Layout coordinates are diagram coordinates only and are not dimensions.
    - Link lengths were overridden with the current design remeasurements supplied on 2026-08-13.
    - AD is 68.0485 mm sloping 10.7746 deg downward from A to D. It sits 50 mm further
      back HORIZONTALLY than the short_ad mount at unchanged A height, which is what the
      two variants share in CAD; the A-D lengths themselves differ by 46.94 mm, not 50.
    - Node IDs follow the dimensioned abstraction directly in the order A through H.
    - Rigid-body membership is ADE (ground), CDG (central), and FGH (distal).
    - Nodes F and G are distinct revolute joints; H is the fingertip/output reference.
    - The combined abstraction uses the middle finger as the nominal human geometry.
    - Human-hand bodies and attachment interfaces are external context and do not alter mechanism mobility.

sources:
  - file: sources/real_thing.jpg
    kind: assembly_photograph
  - file: sources/abstraction.jpg
    kind: dimensioned_abstraction

photo_calibration:
  image: sources/real_thing.jpg
  image_orientation: exif_autorotated_landscape
  image_size_pixels: [4032, 3024]
  pixels_per_mm: 24.3
  relative_uncertainty: 0.08
  method: XL330 case and mounting geometry visible in the photograph
  reference_component: DYNAMIXEL XL330-M288-T
  reference_dimensions_mm: [20.0, 34.0, 26.0]
  reference_url: https://emanual.robotis.com/docs/en/dxl/x/xl330-m288/

# Node table. `layout` is used only to render the abstraction.
nodes:
  - id: a
    source_label: A
    kind: revolute
    role: actuated base pivot
    fixed: true
    layout: [0.0, 0.0]
    initial_position_mm: [0.0, 0.0]
    photo_pixel: [844, 1679]
    confidence: high
  - id: b
    source_label: B
    kind: revolute
    role: input crank endpoint
    fixed: false
    layout: [0.0, 2.466473]
    initial_position_mm: [0.0, 34.530622]
    photo_pixel: [802, 1091]
    confidence: high
  - id: c
    source_label: C
    kind: revolute
    role: loop 1 / loop 2 junction
    fixed: false
    layout: [3.75238, 1.515739]
    initial_position_mm: [52.533314, 21.220346]
    photo_pixel: [1798, 1315]
    confidence: high
  - id: d
    source_label: D
    kind: revolute
    role: ADE-to-CDG revolute connection
    fixed: true
    layout: [4.860607, 0.0]
    initial_position_mm: [68.0485, 0.0]
    photo_pixel: [1796, 1808]
    confidence: high
  - id: e
    source_label: E
    kind: revolute
    role: lower coupler ground pivot
    fixed: true
    layout: [5.998094, 0.387046]
    initial_position_mm: [83.973313, 5.418646]
    photo_pixel: [2036, 1701]
    confidence: high
  - id: f
    source_label: F
    kind: revolute
    role: lower coupler / distal-body joint
    fixed: false
    layout: [7.29141, 2.654827]
    initial_position_mm: [102.079745, 37.167576]
    photo_pixel: [2575, 1775]
    confidence: high
  - id: g
    source_label: G
    kind: revolute
    role: CDG-to-FGH revolute connection
    fixed: false
    layout: [6.466565, 4.396777]
    initial_position_mm: [90.531916, 61.554872]
    photo_pixel: [2668, 1294]
    confidence: high
  - id: h
    source_label: H
    kind: reference
    role: mechanism output TCP
    fixed: false
    layout: [10.439712, 3.104358]
    initial_position_mm: [146.155974, 43.46101]
    photo_pixel: [3464, 1538]
    confidence: high

# Rigid-body/member table. Every body lists all nodes fixed in that body.
# Binary bodies are bars; a body with 3+ nodes is a rigid multi-point body.
bodies:
  - id: ground
    kind: ground
    nodes: [a, d, e]
    role: fixed ADE frame
    confidence: high
    draw_order: 0
    color: "#64748b"
  - id: input_crank
    kind: binary_link
    nodes: [a, b]
    role: actuated crank
    confidence: high
    draw_order: 2
    color: "#2563eb"
  - id: loop_1_coupler
    kind: binary_link
    nodes: [b, c]
    role: first-stage coupler
    confidence: high
    draw_order: 2
    color: "#2563eb"
  - id: central_body
    kind: rigid_body
    nodes: [c, d, g]
    role: rigid CDG body
    confidence: high
    draw_order: 3
    color: "#059669"
  - id: link_ef
    kind: binary_link
    nodes: [e, f]
    role: lower distal coupler
    confidence: high
    draw_order: 4
    color: "#ea580c"
  - id: distal_body
    kind: rigid_body
    nodes: [f, g, h]
    role: rigid FGH distal output body
    render_shape: l_bracket
    render_corner_node: g
    render_arm_nodes: [f, h]
    render_flesh_scale: 1.8
    confidence: high
    draw_order: 1
    color: "#dc2626"

# Joint-incidence table.
joints:
  - node: a
    type: revolute
    bodies: [ground, input_crank]
  - node: b
    type: revolute
    bodies: [input_crank, loop_1_coupler]
  - node: c
    type: revolute
    bodies: [loop_1_coupler, central_body]
  - node: d
    type: revolute
    bodies: [ground, central_body]
  - node: e
    type: revolute
    bodies: [ground, link_ef]
  - node: f
    type: revolute
    bodies: [link_ef, distal_body]
  - node: g
    type: revolute
    bodies: [central_body, distal_body]

# Current joint-centre dimensions aligned to the baseline node names. Values are
# remeasurements except L_ad, which is the rounded value shown on the supplied plot.
dimensions:
  - id: L_ab
    body: input_crank
    nodes: [a, b]
    value: 34.531
    units: mm
    value_source: remeasured
  - id: L_bc
    body: loop_1_coupler
    nodes: [b, c]
    value: 54.193
    units: mm
    value_source: remeasured
  - id: L_cd
    body: central_body
    nodes: [c, d]
    value: 26.287
    units: mm
    value_source: remeasured
  - id: L_ad
    body: ground
    nodes: [a, d]
    value: 68.049
    units: mm
    value_source: cad_remeasured_2026_09
    optimizable: false
    design_role: fixed_tilted_ground_mount_baseline
  - id: L_ae
    body: ground
    nodes: [a, e]
    value: 84.148
    units: mm
    value_source: remeasured
  - id: L_de
    body: ground
    nodes: [d, e]
    value: 16.821
    units: mm
    value_source: remeasured
  - id: L_cg
    body: central_body
    nodes: [c, g]
    value: 55.415
    units: mm
    value_source: remeasured
  - id: L_dg
    body: central_body
    nodes: [d, g]
    value: 65.532
    units: mm
    value_source: remeasured
  - id: L_ef
    body: link_ef
    nodes: [e, f]
    value: 36.549
    units: mm
    value_source: remeasured
  - id: L_fg
    body: distal_body
    nodes: [f, g]
    value: 26.983
    units: mm
    value_source: remeasured
  - id: L_gh
    body: distal_body
    nodes: [g, h]
    value: 58.493
    units: mm
    value_source: remeasured
  - id: L_fh
    body: distal_body
    nodes: [f, h]
    value: 44.523
    units: mm
    value_source: remeasured

# Closed paths are descriptive and are checked against the body table.
loops:
  - id: loop_1
    nodes: [a, b, c, d]
    bodies: [input_crank, loop_1_coupler, central_body, ground]
  - id: loop_2
    nodes: [d, g, f, e]
    bodies: [central_body, distal_body, link_ef, ground]

actuators:
  - id: input_q
    type: rotary
    joint: a
    body: input_crank
    reference_body: ground
    positive_direction: clockwise

outputs:
  - id: mechanism_tcp
    node: h
    body: distal_body

# Nominal human context for the combined exoskeleton abstraction. The finger is
# represented by three rounded rectangles in its horizontal reference pose.
human_hand_model:
  id: nominal_middle_finger
  reference_finger: middle
  source_objective: ../../../src/co-optimization/config/objectives/index.yaml
  pose: mildly_curled
  nominal_flexion_deg:
    mcp: 1.0
    pip: 2.0
    dip: 2.0
  dimension_units: mm
  coordinate_system:
    origin: hand_mcp
    x_direction: proximal_to_distal
    y_direction: dorsal
    joint_polyline_reference: dorsal_upper_surface
  joints:
    - {id: hand_wrist_dorsal, position_mm: [-90.0, 0.0], kind: palm_reference}
    - {id: hand_mcp, node_index: 1, position_mm: [0.0, 0.0], kind: anatomical_revolute}
    - {id: hand_pip, node_index: 2, position_mm: [48.992537, -0.855168], kind: anatomical_revolute}
    - {id: hand_dip, node_index: 3, position_mm: [75.955535, -2.268239], kind: anatomical_revolute}
    - {id: hand_distal_contact, attachment_index: 4, position_mm: [89.404163, -3.444841], kind: attachment_revolute}
    - {id: hand_tip, position_mm: [102.852791, -4.621444], kind: terminal_reference}
  palm:
    id: palm
    joints: [hand_wrist_dorsal, hand_mcp]
    length_mm: 90.0
    width_mm: 25.0
    shape: rounded_rectangle
    orientation: horizontal
    status: assumed_placeholder
  phalanges:
    - id: proximal_phalanx
      joints: [hand_mcp, hand_pip]
      length_mm: 49.0
      width_mm: 20.0
      shape: rounded_rectangle
    - id: middle_phalanx
      joints: [hand_pip, hand_dip]
      length_mm: 27.0
      width_mm: 15.0
      shape: rounded_rectangle
    - id: distal_phalanx
      joints: [hand_dip, hand_tip]
      length_mm: 27.0
      width_mm: 10.0
      shape: rounded_rectangle

# Self-contained human task models used by combined analysis. Candidate
# mechanism.yaml files retain only their own finger row.
finger_analysis_targets:
  - objective: {id: index_finger_design, finger: index}
    phalanx_lengths_mm: {proximal: 40.0, middle: 25.0, distal: 25.0}
    joint_flexion_ranges_deg:
      mcp: {min: 0.0, max: 46.0}
      pip: {min: 0.0, max: 67.0}
      dip: {min: 0.0, max: 27.0}
  - objective: {id: middle_finger_design, finger: middle}
    phalanx_lengths_mm: {proximal: 49.0, middle: 27.0, distal: 27.0}
    joint_flexion_ranges_deg:
      mcp: {min: 0.0, max: 37.0}
      pip: {min: 0.0, max: 79.0}
      dip: {min: 0.0, max: 27.0}
  - objective: {id: ring_finger_design, finger: ring}
    phalanx_lengths_mm: {proximal: 44.0, middle: 26.0, distal: 26.0}
    joint_flexion_ranges_deg:
      mcp: {min: 0.0, max: 39.0}
      pip: {min: 0.0, max: 52.0}
      dip: {min: 0.0, max: 50.0}
  - objective: {id: little_finger_design, finger: little}
    phalanx_lengths_mm: {proximal: 34.0, middle: 23.0, distal: 23.0}
    joint_flexion_ranges_deg:
      mcp: {min: 0.0, max: 65.0}
      pip: {min: 0.0, max: 44.0}
      dip: {min: 0.0, max: 34.0}

exoskeleton_attachments:
  - id: dorsal_input_mount
    mechanism_node: d
    mechanism_interface: fixed_ground_mount
    hand_reference: hand_mcp
    hand_interface: fixed_dorsal_mount
    location: upper_surface_of_first_joint
    dorsal_clearance_mm: 7.0
    clearance_control: upstream_manual_design_parameter
    optimizable: false
    alignment_member: [a, d]
    alignment: tilted
    ad_tilt_deg: 10.7746
    notes:
      - D is separated dorsally from J1 by the manually defined clearance.
      - Change dorsal_clearance_mm in the upstream nominal design, not in Adam.
      - Phalanx widths extend from the shared dorsal surface toward the palmar side.
      - The mechanism is placed on the dorsal side of the mildly curled finger.
  - id: distal_output_rod
    mechanism_node: h
    mechanism_interface: rigid_to_tcp
    hand_reference: hand_distal_contact
    hand_interface: revolute
    connector: binary_rod
    assumed_length_mm: 35.494
    previous_assumption_mm: 15.0
    value_source: retained_pre_fixed_R4_baseline
    surface: distal_phalanx_upper_dorsal
    longitudinal_fraction: 0.5
    rotation: free
    pair_dofs: [rotation]
    status: assumed_placeholder
    notes:
      - The rod is the only connection between TCP H and the human finger.
      - R4 is a fixed revolute at the longitudinal midpoint of the upper distal surface.
      - The physical interface is intended to be a retained distal cuff, not a sliding skin contact.
      - The 28 mm nominal predates fixed R4 and is retained only as the optimization initialization.
      - Rod length stays fixed during one motion sweep but is optimizable between design candidates.
      - Rod length and attachment hardware require physical validation.

# Read-only numerical analysis settings. Angles are offsets from the photographed pose.
analysis:
  workspace_sweep:
    q_min_deg: 0.0
    q_max_deg: 90.0
    steps: 181
    solver_tolerance_mm: 0.00001
    max_iterations: 100

# Nominal placeholders for quasi-static gravity analysis. Replace with measured masses
# and centres of mass before using torque results for component sizing.
mass_model:
  status: nominal_placeholder
  gravity_m_s2: 9.80665
  bodies:
    - body: input_crank
      mass_g: 5.0
      center_node_weights: {a: 0.5, b: 0.5}
    - body: loop_1_coupler
      mass_g: 4.0
      center_node_weights: {b: 0.5, c: 0.5}
    - body: central_body
      mass_g: 8.0
      center_node_weights: {c: 0.333333, d: 0.333334, g: 0.333333}
    - body: link_ef
      mass_g: 1.0
      center_node_weights: {e: 0.5, f: 0.5}
    - body: distal_body
      mass_g: 6.0
      center_node_weights: {f: 0.333333, g: 0.333334, h: 0.333333}
  point_masses:
    - {id: joint_b, node: b, mass_g: 3.0}
    - {id: joint_c, node: c, mass_g: 3.0}
    - {id: joint_f, node: f, mass_g: 3.0}
    - {id: joint_g, node: g, mass_g: 3.0}
    - {id: output_payload, node: h, mass_g: 0.0}

model_readiness:
  topology_plot: ready
  combined_hand_abstraction: ready_assumed_nominal_index_attachment
  numeric_link_table: ready_remeasured_dimensions
  kinematic_sweep: ready_remeasured_geometry
  optimization: adam_crank_driven_passive_hand_synergy_skeleton
  input_torque: ready_nominal_placeholder_mass_model
