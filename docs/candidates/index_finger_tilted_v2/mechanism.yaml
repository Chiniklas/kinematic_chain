  dimension_units: mm
  coordinate_system:
    plane: xy
    x_direction: proximal_to_distal
    y_direction: upward
  notes:
  - Layout coordinates are diagram coordinates only and are not dimensions.
  - Link lengths were overridden with the current design remeasurements supplied on
    2026-08-13.
  - AD is 21.112 mm and slopes downward from A to D by 37.054 deg (2026-09 CAD revision).
  - Node IDs follow the dimensioned abstraction directly in the order A through H.
  - Rigid-body membership is ADE (ground), CDG (central), and FGH (distal).
  - Nodes F and G are distinct revolute joints; H is the fingertip/output reference.
  - The combined abstraction uses the index finger as the nominal human geometry.
  - Human-hand bodies and attachment interfaces are external context and do not alter
    mechanism mobility.
