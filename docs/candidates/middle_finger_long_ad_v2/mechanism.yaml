schema_version: 1
mechanism:
  id: mechanism_2_middle
  name: "Mechanism 2 \u2014 middle finger candidate"
  model_kind: planar_body_joint_graph
  status: co_optimization_candidate
  dimension_units: mm
  coordinate_system:
    plane: xy
    x_direction: proximal_to_distal
    y_direction: upward
  notes:
  - Layout coordinates are diagram coordinates only and are not dimensions.
  - Link lengths were overridden with the current design remeasurements supplied on
    2026-08-13.
  - AD is 71.112 mm sloping 10.305 deg downward from A to D; it is the short_ad mount
    extended by 50 mm at unchanged A height, so the two variants align in CAD.
  - Node IDs follow the dimensioned abstraction directly in the order A through H.
  - Rigid-body membership is ADE (ground), CDG (central), and FGH (distal).
  - Nodes F and G are distinct revolute joints; H is the fingertip/output reference.
  - The combined abstraction uses the middle finger as the nominal human geometry.
  - Human-hand bodies and attachment interfaces are external context and do not alter
    mechanism mobility.
