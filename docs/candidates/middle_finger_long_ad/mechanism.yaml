  optimizable: false
  alignment_member:
  - a
  - d
  alignment: tilted
  ad_tilt_deg: 10.7746
  notes:
  - D is separated dorsally from J1 by the manually defined clearance.
  - Change dorsal_clearance_mm in the upstream nominal design, not in Adam.
  - Phalanx widths extend from the shared dorsal surface toward the palmar side.
  - The mechanism is placed on the dorsal side of the mildly curled finger.
- id: distal_output_rod
  mechanism_node: h
  mechanism_interface: rigid_to_tcp
  hand_reference: hand_distal_contact
  hand_interface: revolute
  connector: binary_rod
  assumed_length_mm: 35.494330795138424
  previous_assumption_mm: 15.0
  value_source: co_optimization_candidate
  surface: distal_phalanx_upper_dorsal
  longitudinal_fraction: 0.5
  rotation: free
  pair_dofs:
  - rotation
  status: assumed_placeholder
  notes:
  - The rod is the only connection between TCP H and the human finger.
  - R4 is a fixed revolute at the longitudinal midpoint of the upper distal surface.
  - The physical interface is intended to be a retained distal cuff, not a sliding
    skin contact.
  - The 28 mm nominal predates fixed R4 and is retained only as the optimization initialization.
  - Rod length stays fixed during one motion sweep but is optimizable between design
    candidates.
  - Rod length and attachment hardware require physical validation.
